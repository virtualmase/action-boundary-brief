<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Action Boundary Brief</title><desc id="desc">A five-gate relay represents intent, resources, decision right, interruption, and record.</desc><rect width="1200" height="630" fill="#f4f2e9"/><g fill="none" stroke="#c3c8c5"><path d="M0 511h1200M93 0v630M0 126h1200"/><circle cx="1040" cy="70" r="270"/></g><g fill="#17202a" font-family="Georgia,serif"><text x="93" y="146" font-size="32">ACTION BOUNDARY BRIEF / OPEN-SOURCE SKILL</text><text x="93" y="298" font-size="93">Before an AI system acts,</text><text x="93" y="395" font-size="93">name the <tspan fill="#1746c8" font-style="italic">boundary.</tspan></text></g><path d="M594 505h454" fill="none" stroke="#1746c8" stroke-width="5" stroke-dasharray="12 12"/><g stroke="#17202a" stroke-width="3" fill="#f4f2e9"><rect x="598" y="470" width="70" height="70"/><rect x="698" y="470" width="70" height="70"/><rect x="798" y="470" width="70" height="70" fill="#1746c8" stroke="#1746c8"/><rect x="898" y="470" width="70" height="70"/><rect x="998" y="470" width="70" height="70"/></g><g font-family="monospace" font-size="13" text-anchor="middle" fill="#17202a"><text x="633" y="512">INTENT</text><text x="733" y="512">RESOURCE</text><text x="833" y="512" fill="#fff">RIGHT</text><text x="933" y="512">PAUSE</text><text x="1033" y="512">RECORD</text></g><rect x="93" y="451" width="462" height="4" fill="#ce6545"/></svg>
